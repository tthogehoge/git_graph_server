<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><title>__PROJECT__ - {{file_view}}</title>
__FAVICON__
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
<style>
  html, body { height: 100%; margin: 0; font-family: system-ui, sans-serif; font-size: 13px; color: #222; }
  body { display: flex; }
  #tree { width: 360px; flex: none; overflow: auto; border-right: 1px solid #ccc; background: #fafafa; padding: 12px; box-sizing: border-box; }
  #main { flex: 1; min-width: 0; overflow: auto; padding: 14px 18px; box-sizing: border-box; }
  h1 { font-size: 15px; margin: 0 0 8px; word-break: break-all; }
  h2 { font-size: 14px; margin: 0 0 8px; }
  .meta, .hint { color: #666; margin: 3px 0; }
  .crumb { margin: 8px 0; word-break: break-all; }
  .crumb a, .entry { color: #06c; text-decoration: none; cursor: pointer; }
  .crumb a:hover, .entry:hover { text-decoration: underline; }
  .entry { display: flex; gap: 8px; padding: 4px 6px; border-radius: 3px; font-family: monospace; }
  .entry:hover { background: #eef; }
  .st { display: inline-block; min-width: 1.3em; text-align: center; font-weight: bold; color: #fff; border-radius: 2px; margin-right: 4px; font-family: system-ui, sans-serif; }
  .stM { background: #d29922; } .stA { background: #1a7f37; } .stD { background: #cf222e; } .stR { background: #6f42c1; } .stU { background: #cf222e; } .stN { background: #888; }
  .entry .size { margin-left: auto; color: #777; white-space: nowrap; }
  pre { white-space: pre-wrap; word-break: break-word; background: #fff; border: 1px solid #ddd; padding: 10px; font: 12px monospace; }
  pre.code { color: #24292f; tab-size: 4; }
  pre.code { padding-left: 0; }
  .ln { display: flex; }
  .ln:hover { background: #f6f8fa; }
  .ln .no { flex: none; width: var(--nw, 3ch); box-sizing: content-box; padding: 0 10px; margin-right: 10px; text-align: right; color: #8c959f; border-right: 1px solid #e3e3e3; user-select: none; }
  .ln .tx { flex: 1; min-width: 0; }
  .tok-keyword { color: #8250df; font-weight: 600; }
  .tok-string { color: #0a7b35; }
  .tok-comment { color: #6e7781; font-style: italic; }
  .tok-number { color: #0550ae; }
  .tok-type { color: #953800; }
  .tok-tag { color: #116329; }
  .tok-attr { color: #8250df; }
  .tok-regex { color: #cf222e; }
  .binary { color: #777; padding: 10px; border: 1px solid #ddd; }
  .file-actions { display: flex; gap: 6px; margin: 8px 0; }
  .file-actions[hidden] { display: none; }
  .patch-bar { flex-wrap: wrap; align-items: center; }
  .file-actions button { background: #e8eefc; border: 1px solid #b8c7ee; padding: 4px 8px; border-radius: 3px; cursor: pointer; }
  .file-actions button:hover { background: #d6e2fb; }
  .file-actions .msg { margin-left: 8px; color: #0a7b35; white-space: pre-wrap; }
  .file-actions .msg.err { color: #c00; }
  table.file-log { border-collapse: collapse; width: 100%; margin-top: 8px; }
  table.file-log td { border-bottom: 1px solid #e3e3e3; padding: 5px 6px; vertical-align: top; }
  table.file-log td.hash { width: 1%; font-family: monospace; white-space: nowrap; }
  table.file-log td.date { width: 1%; color: #777; white-space: nowrap; }
  table.file-log a { color: inherit; text-decoration: none; }
  table.file-log tr:hover td { background: #eef; }
  .blame-line { display: flex; font: 12px monospace; white-space: pre-wrap; }
  .blame-line:hover { background: #f6f8fa; }
  .blame-no { flex: none; width: 8ch; box-sizing: border-box; padding-right: 1ch; text-align: right; color: #8c959f; }
  .blame-meta { flex: none; width: 24em; overflow: hidden; text-overflow: ellipsis; color: #666; }
  .blame-meta a { color: inherit; text-decoration: none; }
  .blame-meta a:hover { text-decoration: underline; }
  .blame-code { min-width: 0; }
  .edit-info { color: #666; margin: 4px 0; }
  .edit-info.warn { color: #b35900; }
  textarea.editor { width: 100%; height: calc(100vh - 190px); min-height: 200px; box-sizing: border-box; font: 12px monospace; tab-size: 4; padding: 8px; border: 1px solid #bbb; resize: vertical; white-space: pre; overflow-wrap: normal; }
  .edit-bar { display: flex; gap: 6px; margin: 6px 0; }
  .edit-bar button { background: #e8eefc; border: 1px solid #b8c7ee; padding: 4px 10px; border-radius: 3px; cursor: pointer; }
  .edit-bar button.primary { background: #1a7f37; border-color: #1a7f37; color: #fff; }
  .edit-bar button:disabled { opacity: .5; cursor: default; }
  .file-actions button:disabled { opacity: .5; cursor: default; }
</style><script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script></head>
<body><aside id="tree"><h1>{{file_view}}</h1><div class="meta" id="commit"></div><div class="file-actions patch-bar"><button id="patchCreateBtn">{{patch_create}}</button><button id="patchApplyBtn" hidden title="{{tip_patch_apply}}">{{patch_apply}}</button><input type="file" id="patchFile" hidden><span id="patchMsg" class="msg"></span></div><div id="list"></div></aside>
<main id="main"><h2 id="title">{{select_file}}</h2>
<div id="fileActions" class="file-actions" hidden><button id="fileLogBtn">{{file_log}}</button><button id="fileBlameBtn">{{file_blame}}</button><button id="fileDiffBtn" hidden>{{file_diff}}</button><button id="fileEditBtn" hidden>{{file_edit}}</button><button id="fileContentBtn" hidden>{{file_content}}</button><button id="fileCopyBtn" hidden>{{copy_to_work}}</button><button id="fileDownloadBtn" hidden>{{file_download}}</button><button id="fileRmBtn" hidden title="{{tip_rm_file}}">{{rm_button}}</button><button id="fileRmCachedBtn" hidden title="{{tip_rm_cached_file}}">{{rm_cached_button}}</button><span id="fileMsg" class="msg"></span></div>
<div id="content" class="hint">{{select_file_hint}}</div></main>
<script>
/*__FILE_I18N__*/
function t(key, values = {}) {
  let text = key in I18N ? I18N[key] : key;
  Object.entries(values).forEach(([name, value]) => { text = text.replaceAll("{" + name + "}", () => String(value)); });
  return text;
}

const PROJECT_DOCUMENT_TITLE = document.title.slice(0, document.title.length - t("file_view").length - 3);  // ウィンドウタイトルは「プロジェクト名 - 表示対象」
function setDocumentTitle(label) {
  document.title = PROJECT_DOCUMENT_TITLE + " - " + (label || t("file_view"));
}

const qs = new URLSearchParams(location.search), hash = qs.get("hash"), fileViewTab = qs.get("file_view") === "1";
const list = document.getElementById("list"), content = document.getElementById("content"), title = document.getElementById("title");
const fileActions = document.getElementById("fileActions"), fileLogBtn = document.getElementById("fileLogBtn"), fileBlameBtn = document.getElementById("fileBlameBtn"), fileContentBtn = document.getElementById("fileContentBtn");
const fileDownloadBtn = document.getElementById("fileDownloadBtn");
const fileRmBtn = document.getElementById("fileRmBtn"), fileRmCachedBtn = document.getElementById("fileRmCachedBtn");
const fileCopyBtn = document.getElementById("fileCopyBtn"), fileMsg = document.getElementById("fileMsg");
const fileDiffBtn = document.getElementById("fileDiffBtn"), fileEditBtn = document.getElementById("fileEditBtn");
const patchCreateBtn = document.getElementById("patchCreateBtn"), patchApplyBtn = document.getElementById("patchApplyBtn");
const patchFile = document.getElementById("patchFile"), patchMsg = document.getElementById("patchMsg");
const CAN_EDIT = CAN_COPY && hash === "WIP";  // 作業ツリーのファイルだけ編集できる (書き込みが有効なとき)
const isWip = hash === "WIP";  // 作業ツリーのファイルを表示する
fileCopyBtn.hidden = !CAN_COPY || isWip;
let current = "", currentFile = "", wipHead = null;
let entryInfo = {}, commitChanges = null;  // entryInfo: パス → 一覧の項目 (WIP の変更の種類 xy), commitChanges: パス → コミットでの変更
function diffParams(path) {  // このファイルの差分ページの引数。変更がなければ null
  if (isWip) {
    const xy = (entryInfo[path] || {}).xy;
    if (!xy) return null;
    const st = entryInfo[path].st;
    const kind = xy === "??" ? "untracked" : st === "U" ? "conflict" : xy[1] !== " " ? "unstaged" : "staged";
    return {path: path, wip: kind};
  }
  const f = commitChanges && commitChanges[path];
  if (!f) return null;
  const p = {hash: hash, path: path};
  if (f.old_path) p.old = f.old_path;
  return p;
}
function updateRmBtns() {  // git rm できるのは、作業ツリー表示の追跡中のファイルだけ (書き込みが有効なとき)
  const tracked = !!currentFile && (entryInfo[currentFile] || {}).xy !== "??";
  fileRmBtn.hidden = fileRmCachedBtn.hidden = !(CAN_EDIT && tracked);
}
function updateDiffBtn() { fileDiffBtn.hidden = !currentFile || !diffParams(currentFile); updateRmBtns(); }
function loadCommitChanges() {  // このコミットで変更されたファイル (差分ボタンを出すかどうかに使う)
  if (isWip || !hash) return;
  api("/api/commit", {hash: hash}).then(c => {
    commitChanges = {};
    c.files.forEach(f => { commitChanges[f.path] = f; });
    updateDiffBtn();
  }).catch(() => {});
}
fileDiffBtn.onclick = () => {
  const p = currentFile && diffParams(currentFile);
  if (p) location.href = "/diff?" + new URLSearchParams(p);
};
function logHash() { return isWip ? wipHead : hash; }  // ファイルのログの起点 (作業ツリーなら HEAD)
function esc(s) { return String(s).replace(/[&<>\"]/g, c => ({"&":"&amp;", "<":"&lt;", ">":"&gt;", "\"":"&quot;"}[c])); }
function api(path, params) { return fetch(path + "?" + new URLSearchParams(params)).then(r => r.ok ? r.json() : r.text().then(t => { throw new Error(t || r.status); })); }
function showError(e) { list.innerHTML = '<p class="hint">' + t("error") + esc(e.message) + '</p>'; }
function pageUrl(path, file, view) {  // 表示中のディレクトリ・ファイル・表示 (edit / blame / log) を URL に残す (戻る/進む・再読み込みで復元する)
  const p = new URLSearchParams({hash: hash});
  if (path) p.set("path", path);
  if (file) p.set("file", file);
  if (file && view) p.set("view", view);
  if (fileViewTab) p.set("file_view", "1");
  return "?" + p;
}
const ST_CLASS = {M: "stM", A: "stA", D: "stD", R: "stR", U: "stU", "?": "stN"};
function statusBadge(e) {  // 作業ツリー表示での変更の印 (ディレクトリは中に変更があるとき)
  if (!e.st) return "";
  const tip = e.type === "tree" ? t("wip_dir_changed") : e.xy === "??" ? t("untracked") : e.st === "U" ? t("conflict")
    : [e.xy[0] !== " " ? t("staged") : "", e.xy[1] !== " " ? t("unstaged") : ""].filter(Boolean).join(" / ");
  return '<span class="st ' + (ST_CLASS[e.st] || "stM") + '" title="' + esc(tip) + '">' + esc(e.st) + '</span>';
}
function loadTree(path, push) {
  current = path;
  if (push) history.pushState({path: path, file: currentFile, view: currentView}, "", pageUrl(path, currentFile, currentView));
  return api("/api/tree", {hash: hash, path: path}).then(r => {
    if (isWip) wipHead = r.head || null;
    document.getElementById("commit").textContent = isWip
      ? t("working_tree_files") + (r.head ? " (HEAD " + r.head.slice(0, 7) + ")" : "") : r.hash.slice(0, 7);
    const parts = path ? path.split("/") : [];
    let crumb = '<div class="crumb"><a data-dir="">📁 ' + t("root") + '</a>';
    parts.forEach((p, i) => { const d = parts.slice(0, i + 1).join("/"); crumb += ' / <a data-dir="' + esc(d) + '">' + esc(p) + '</a>'; });
    crumb += '</div>';
    list.innerHTML = crumb + (r.entries.length ? r.entries.map(e => {
      const p = path ? path + "/" + e.name : e.name;
      entryInfo[p] = e;
      const icon = e.type === "tree" ? "📁" : "📄";
      const size = e.size === null ? "" : e.size.toLocaleString() + " B";
      return '<div class="entry" data-type="' + e.type + '" data-path="' + esc(p) + '"><span>' + icon + ' ' + statusBadge(e) + esc(e.name) + '</span><span class="size">' + size + '</span></div>';
    }).join("") : '<p class="hint">' + t("empty_directory") + '</p>');
    list.querySelectorAll("[data-dir]").forEach(a => a.onclick = () => loadTree(a.dataset.dir, true));
    list.querySelectorAll(".entry").forEach(a => a.onclick = () => a.dataset.type === "tree" ? loadTree(a.dataset.path, true) : loadFile(a.dataset.path, true));
  }).catch(showError);
}
fileDownloadBtn.onclick = () => {  // Content-Disposition: attachment なので、画面は移動せず保存される
  if (currentFile) location.href = "/download?" + new URLSearchParams({hash: hash, path: currentFile});
};
function doRm(cached) {  // git rm / git rm --cached。変更のあるファイルは -f で実行する (確認文で変更が失われることを伝える)
  if (!currentFile || !CAN_EDIT) return;
  const path = currentFile, changed = !!(entryInfo[path] || {}).xy;
  const text = cached ? t("confirm_rm_cached_file", {path: path})
    : changed ? t("confirm_rm_file_changed", {path: path}) : t("confirm_rm_file", {path: path});
  if (!confirm(text)) return;
  fileRmBtn.disabled = fileRmCachedBtn.disabled = true;
  fetch("/api/rm", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({paths: [path], cached: cached, force: changed})})
    .then(r => r.ok ? r.json() : r.text().then(m => { throw new Error(m || r.status); }))
    .then(r => {
      entryInfo = {};  // 一覧を読み直す (ステージされた削除や、未追跡になったことを反映する)
      return loadTree(current, false).then(() => {
        if (cached) { updateDiffBtn(); setFileMsg(r.message, true); }
        else { clearFile(); setFileMsg(r.message, true); }
      });
    })
    .catch(e => setFileMsg(e.message, false))
    .finally(() => { fileRmBtn.disabled = fileRmCachedBtn.disabled = false; });
}
fileRmBtn.onclick = () => doRm(false);
fileRmCachedBtn.onclick = () => doRm(true);
// ---- パッチの作成 (ダウンロード) と適用 (アップロード) ----
function setPatchMsg(text, ok) { patchMsg.textContent = text; patchMsg.className = "msg" + (ok ? "" : " err"); }
patchCreateBtn.title = t(isWip ? "tip_patch_create_wip" : "tip_patch_create_commit");
patchCreateBtn.onclick = () => {  // 失敗 (変更なしなど) のときにページを移動しないよう、fetch で取得して保存する
  setPatchMsg("", true);
  patchCreateBtn.disabled = true;
  fetch("/patch?" + new URLSearchParams({hash: hash}))
    .then(r => r.ok ? r.blob() : r.text().then(m => { throw new Error(m || r.status); }))
    .then(blob => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = isWip ? "wip.patch" : hash.slice(0, 7) + ".patch";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    })
    .catch(e => setPatchMsg(e.message, false))
    .finally(() => { patchCreateBtn.disabled = false; });
};
patchApplyBtn.hidden = !CAN_EDIT;  // 作業ツリーの表示で、書き込みが有効なときだけ
patchApplyBtn.onclick = () => { if (leaveEdit()) { patchFile.value = ""; patchFile.click(); } };
function bytesToBase64(bytes) {
  let s = "";
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
}
patchFile.onchange = () => {
  const f = patchFile.files[0];
  if (!f) return;
  const size = f.size < 1024 ? f.size + " B" : Math.ceil(f.size / 1024) + " KB";
  if (!confirm(t("confirm_patch_apply", {name: f.name, size: size}))) return;
  setPatchMsg("", true);
  patchApplyBtn.disabled = true;
  f.arrayBuffer()
    .then(buf => fetch("/api/patch-apply", {method: "POST", headers: {"Content-Type": "application/json"},
                                             body: JSON.stringify({data: bytesToBase64(new Uint8Array(buf))})}))
    .then(r => r.ok ? r.json() : r.text().then(m => { throw new Error(m || r.status); }))
    .then(r => {
      setPatchMsg(r.message, true);
      entryInfo = {};  // 変更の印と、開いているファイルの内容を読み直す
      return loadTree(current, false).then(() => { if (currentFile) return loadFile(currentFile, false); });
    })
    .catch(e => setPatchMsg(e.message, false))
    .finally(() => { patchApplyBtn.disabled = false; });
};
function setFileMsg(text, ok) { fileMsg.textContent = text; fileMsg.className = "msg" + (ok ? "" : " err"); }
function defaultCopyName(path) {  // 例: src/a.py → src/a_1234567.py
  const i = path.lastIndexOf("/"), dir = path.slice(0, i + 1), name = path.slice(i + 1), dot = name.lastIndexOf(".");
  const suffix = "_" + hash.slice(0, 7);
  return dir + (dot > 0 ? name.slice(0, dot) + suffix + name.slice(dot) : name + suffix);
}
fileCopyBtn.onclick = () => {
  if (!currentFile) return;
  const dest = prompt(t("prompt_copy_dest"), defaultCopyName(currentFile));
  if (dest === null || !dest.trim()) return;
  fetch("/api/file-copy", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({hash: hash, path: currentFile, dest: dest.trim()})})
    .then(r => r.ok ? r.json() : r.text().then(m => { throw new Error(m || r.status); }))
    .then(r => setFileMsg(r.message, true))
    .catch(e => setFileMsg(e.message, false));
};
function clearFile() {  // ファイルを選ぶ前の表示に戻す
  currentFile = ""; currentView = "";
  setDocumentTitle("");
  fileActions.hidden = true;
  title.textContent = t("select_file");
  content.className = "hint";
  content.textContent = t("select_file_hint");
}
function loadFile(path, push) {
  if (!leaveEdit()) return;
  if (push && (path !== currentFile || currentView)) history.pushState({path: current, file: path}, "", pageUrl(current, path));
  currentFile = path; currentView = "";
  setDocumentTitle(path);
  setFileMsg("", true);
  fileActions.hidden = false;
  fileLogBtn.hidden = !logHash();
  fileBlameBtn.hidden = isWip && !wipHead;
  fileContentBtn.hidden = true;
  fileDownloadBtn.hidden = false;
  updateDiffBtn();
  fileEditBtn.hidden = true; fileData = null;
  return api("/api/file", {hash: hash, path: path}).then(r => {
    if (path !== currentFile) return;
    fileData = r;
    fileEditBtn.hidden = !CAN_EDIT || r.binary;
    fileEditBtn.disabled = !r.editable;
    fileEditBtn.title = r.editable ? "" : t(r.edit_reason || "edit_bad_encoding");
    const lang = languageFor(r.path);
    title.textContent = r.path + (lang ? " (" + lang + ")" : "") + (r.encoding ? " [" + r.encoding + "]" : "");
    content.className = r.binary ? "binary" : "";
    content.innerHTML = r.binary ? t("binary_file") : numberedCode(r.content, lang) + (r.truncated ? '<p class="hint">' + t("large_file_head") + '</p>' : '');
    fileBlameBtn.hidden = r.binary || (isWip && !wipHead);
  }).catch(e => { title.textContent = path; content.className = "hint"; content.textContent = t("error") + e.message; });
}
// ---- ファイルごとの表示 (内容 / 編集 / blame / ログ) ----
// 表示を切り替えるたびに履歴に積む。viaPush: 同じファイルの前の表示から来た (「ファイル内容」などは履歴を戻る)
let currentView = "", afterRestore = null;
function logInTab() { return fileViewTab || (window.opener && !window.opener.closed); }
function renderView(view) {
  currentView = view;
  if (view === "edit") {
    if (!CAN_EDIT) setFileMsg(t("write_disabled"), false);
    else if (fileData && fileData.editable) startEdit();
    else if (fileData) setFileMsg(t(fileData.edit_reason || "edit_bad_encoding"), false);
  } else if (view === "blame") loadFileBlame(currentFile);
  else if (view === "log" && logInTab()) loadFileLog(currentFile);
}
function openView(view) {
  if (!currentFile || view === currentView) return;
  if (!leaveEdit()) return;
  history.pushState({path: current, file: currentFile, view: view, viaPush: true}, "", pageUrl(current, currentFile, view));
  if (currentView === "edit" || !fileData) loadFile(currentFile, false).then(() => renderView(view));  // 編集欄を閉じて内容を出し直す
  else renderView(view);
}
function backToContent(after) {  // ファイル内容の表示に戻る。前の履歴が同じファイルならそこへ戻る
  if (history.state && history.state.viaPush) { afterRestore = after || null; history.back(); return; }
  history.replaceState({path: current, file: currentFile}, "", pageUrl(current, currentFile));
  const done = loadFile(currentFile, false);
  if (after && done) done.then(after);
}
// ---- 編集 (作業ツリーのみ) ----
// 編集欄では改行が LF になるので、保存時にサーバー側で元の改行コード・文字コード・BOM に戻す
let fileData = null, editing = false, editDirty = false;
const EOL_LABEL = {crlf: "CRLF", lf: "LF", cr: "CR"};
function leaveEdit() {  // 編集中なら、変更を捨ててよいか確認して編集をやめる
  if (editing && editDirty && !confirm(t("edit_discard_confirm"))) return false;
  editing = editDirty = false;
  return true;
}
window.addEventListener("beforeunload", ev => { if (editing && editDirty) { ev.preventDefault(); ev.returnValue = ""; } });
function startEdit() {
  if (!fileData || !fileData.editable || !currentFile) return;
  editing = true; editDirty = false;
  setFileMsg("", true);
  [fileLogBtn, fileBlameBtn, fileDiffBtn, fileEditBtn, fileContentBtn, fileCopyBtn, fileDownloadBtn, fileRmBtn, fileRmCachedBtn].forEach(b => { b.hidden = true; });
  const eol = EOL_LABEL[fileData.eol] || t("edit_eol_none");
  title.textContent = t("file_edit_title", {path: currentFile});
  content.className = "";
  content.innerHTML = '<div class="edit-info">' + esc(t("edit_format", {encoding: fileData.encoding, eol: eol})) + '</div>' +
    (fileData.eol_mixed ? '<div class="edit-info warn">' + esc(t("edit_eol_mixed", {eol: eol})) + '</div>' : "") +
    '<div class="edit-bar"><button class="primary" id="editSave">' + esc(t("edit_save")) + '</button><button id="editCancel">' +
    esc(t("edit_cancel")) + '</button></div><textarea class="editor" id="editor" spellcheck="false"></textarea>';
  const ta = document.getElementById("editor");
  ta.value = fileData.content;
  ta.focus();
  ta.addEventListener("input", () => { editDirty = true; });
  ta.addEventListener("keydown", ev => {
    if ((ev.ctrlKey || ev.metaKey) && ev.key === "s") { ev.preventDefault(); saveEdit(); }
