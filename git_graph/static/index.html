<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>__PROJECT__ - git graph</title>
__FAVICON__
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<!--__MENUBAR__-->
<div id="panes">
<div id="graphWrap">
<div id="graphStatus" role="region" aria-label="{{notifications}}"></div>
<div id="actionModal" hidden>
  <form class="action-dialog" id="actionForm" role="dialog" aria-modal="true" aria-labelledby="actionTitle">
    <h2 id="actionTitle"></h2>
    <div class="action-fields" id="actionFields"></div>
    <div class="amsg ng" id="actionError" role="alert"></div>
    <div class="dialog-buttons">
      <button type="button" class="abtn" data-dialog-cancel>{{cancel}}</button>
      <button type="submit" class="abtn" id="actionSubmit"></button>
    </div>
  </form>
</div>
<div id="coModal" hidden><div class="comodal" role="dialog" aria-modal="true">
  <div><b id="coTitle">{{checkout_blocked}}</b> — <span id="coSub">{{checkout_blocked_hint}}</span></div>
  <div id="coFiles"></div>
  <div class="hint" id="coHint">{{co_hint_stash}}<br>
  {{co_hint_discard}}</div>
  <div class="arow"><button class="abtn" id="coStashBtn" data-co="stash">{{stash_checkout}}</button>
    <button class="abtn danger" id="coDiscardBtn" data-co="discard">{{discard_checkout}}</button>
    <button class="abtn" data-co="cancel">{{cancel}}</button></div>
</div></div>
<div id="confirmModal" hidden><div class="comodal" role="dialog" aria-modal="true" aria-labelledby="confirmModalMsg">
  <div id="confirmModalMsg" class="confirm-msg"></div>
  <input type="text" id="confirmModalInput" hidden>
  <div class="hint">{{dialog_suppressed_note}}</div>
  <div class="arow">
    <button class="abtn" id="confirmModalOk">{{ok}}</button>
    <button class="abtn" id="confirmModalCancel">{{cancel}}</button>
  </div>
</div></div>
<div id="graph">
  <div id="loading">
    <div class="spin"></div>
    <div>{{loading_graph}}</div>
    <div class="hint" id="lsub">{{loading_graph_hint}}</div>
  </div>
</div>
</div>
<div id="splitter" role="separator" aria-orientation="vertical" aria-label="{{resize_panel}}" tabindex="0"></div>
<div id="panel">
  <div id="listView"><p class="hint">{{graph_help_1}}</p>
    <p class="hint">{{graph_help_2}}</p>
    <p class="hint">{{graph_help_3}}</p></div>
  <div id="detailView"></div>
</div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
