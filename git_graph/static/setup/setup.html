<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{setup_title}} - git graph</title>
__FAVICON__
<link rel="stylesheet" href="/static/setup/setup.css">
</head>
<body>
<main>
<h1>{{setup_title}}</h1>
<p class="lead">{{setup_lead}}</p>
<form id="setupForm" autocomplete="off">
  <label for="setupPath">{{setup_path_label}}</label>
  <input type="text" id="setupPath" value="__PATH__" spellcheck="false" autofocus>
  <div class="hint">{{setup_path_hint}}</div>

  <label for="setupUrl">{{setup_url_label}}</label>
  <input type="text" id="setupUrl" placeholder="https://github.com/user/repo.git" spellcheck="false">
  <div class="hint">{{setup_url_hint}}</div>

  <div id="setupAuth" hidden>
    <div id="setupAuthNote"></div>
    <label for="setupUser">{{setup_username}}</label>
    <input type="text" id="setupUser" autocomplete="username">
    <label for="setupPass">{{setup_password}}</label>
    <input type="password" id="setupPass" autocomplete="current-password">
  </div>

  <div class="err" id="setupError" role="alert"></div>
  <div class="actions">
    <button type="submit" id="setupSubmit">{{setup_open}}</button>
    <span id="setupBusy"></span>
  </div>
</form>
</main>
<script src="/static/i18n.js"></script>
<script src="/static/setup/setup.js"></script>
</body>
</html>
