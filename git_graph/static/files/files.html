<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><title>__PROJECT__ - {{file_view}}</title>
__FAVICON__
<script>/*__FLAGS__*/</script>
<link rel="stylesheet" href="/static/files/files.css">
<link rel="stylesheet" href="/static/common/menubar.css">
<link rel="stylesheet" href="/static/common/wip_panel.css">
<link rel="stylesheet" href="/static/common/commit_log.css">
<link rel="stylesheet" href="/static/common/log_select.css">
</head>
<body>
<!--__MENUBAR__-->
<div id="panes">
<div id="statusToasts" role="region" aria-label="{{notifications}}"></div>
<aside id="tree"><div class="meta" id="commit"></div><div id="smMsg" class="sm-msg"></div>
<div class="side-tabs" id="sideTabs" hidden><button id="sideTreeBtn" class="on">{{side_tree}}</button><button id="sideChangesBtn">{{side_changes}}</button></div><div class="sel-bar" id="selBar" hidden><div class="file-actions patch-bar sel-bar-btns"><button id="selCommitBtn" title="{{tip_sel_commit}}">{{wip_commit}}</button><button id="selAddBtn" disabled title="{{tip_stage_selected}}">{{stage_button}}</button><button id="selRmBtn" disabled title="{{tip_rm_selected}}">{{rm_button}}</button><button id="selRmCachedBtn" disabled title="{{tip_rm_cached_selected}}">{{rm_cached_button}}</button><span id="selMsg" class="msg"></span></div></div><div id="list"></div><div id="changes" hidden></div></aside>
<div id="sideSplitter" role="separator" aria-orientation="vertical" aria-label="{{resize_side}}" tabindex="0"></div>
<main id="main"><div id="fileView"><h2 id="title">{{select_file}}</h2>
<div id="dirActions" class="file-actions" hidden><button id="dirCommitLogBtn">{{log}}</button><button id="dirLogBtn">{{dir_log}}</button><button id="dirListBtn" hidden>{{dir_list}}</button><button id="dirGraphLogBtn" hidden>{{file_log_graph}}</button><button id="dirNewDirBtn" hidden title="{{tip_create_dir}}">{{create_dir}}</button><button id="dirNewFileBtn" hidden title="{{tip_create_file}}">{{create_file}}</button><button id="dirMoveBtn" hidden title="{{tip_move_dir}}">{{move_btn}}</button></div>
<div id="fileActions" class="file-actions" hidden><button id="fileCommitLogBtn">{{log}}</button><button id="fileLogBtn">{{file_log}}</button><button id="fileBlameBtn">{{file_blame}}</button><button id="fileDiffBtn">{{file_diff}}</button><button id="fileContentBtn" hidden>{{file_content}}</button><button id="fileEditBtn">{{file_edit}}</button><button id="fileMergeBtn" title="{{tip_merge_editor}}" hidden>{{merge_editor}}</button><button id="fileExtEditBtn" title="{{tip_open_editor}}">{{open_editor}}</button><button id="fileExtDiffBtn" title="{{tip_open_diff_tool}}" hidden>{{open_diff_tool}}</button><button id="fileGraphLogBtn" hidden>{{file_log_graph}}</button><button id="fileCopyBtn">{{copy_to_work}}</button><button id="fileDownloadBtn">{{file_download}}</button><button id="fileUploadBtn" title="{{tip_file_upload}}" hidden>{{file_upload_overwrite}}</button><button id="fileMoveBtn" title="{{tip_move_file}}" hidden>{{move_btn}}</button><button id="fileRmBtn" title="{{tip_rm_file}}">{{rm_button}}</button><button id="fileRmCachedBtn" title="{{tip_rm_cached_file}}">{{rm_cached_button}}</button><span id="fileMsg" class="msg"></span></div>
<div id="content" class="hint">{{select_file_hint}}</div></div><section id="wipCommitView" hidden><h2>{{wip_title}} <button type="button" class="sbtn" id="wipCommitBack">{{back_history}}</button></h2><div id="wipCommitPanel"></div></section></main>
</div>
<script src="/static/i18n.js"></script>
<script src="/static/common/log_select.js"></script>
<script src="/static/common/commit_log.js"></script>
<script src="/static/common/log_graph.js"></script>
<script src="/static/common/repository_sync.js"></script>
<script src="/static/common/worktree_prefs.js"></script>
<script src="/static/common/copy.js"></script>
<script src="/static/common/pane_resize.js"></script>
<script src="/static/diff/diff_editor_view.js"></script>
<script src="/static/common/message_log.js"></script>
<script src="/static/common/toast.js"></script>
<script src="/static/common/other_lists.js"></script>
<script src="/static/files/js/01_core.js"></script>
<script src="/static/files/js/02_left_pane.js"></script>
<script src="/static/files/js/03_tree_nav.js"></script>
<script src="/static/files/js/04_selection.js"></script>
<script src="/static/vendor/marked.js"></script>
<script src="/static/files/js/05_dir_file.js"></script>
<script src="/static/files/js/06_edit.js"></script>
<script src="/static/files/js/06_md_attach.js"></script>
<script src="/static/files/js/07_boot.js"></script>
<script>/*__MENUBAR_DIALOG__*/</script>
<script src="/static/common/patch_ops.js"></script>
<script src="/static/common/page_menubar.js"></script>
<script src="/static/common/wip_panel.js"></script>
<script src="/static/common/wip_panel_mount.js"></script>
<!--__WIP_DIFF_REMOTE__-->
<script src="/static/files/wip_mount.js"></script>
</body></html>
